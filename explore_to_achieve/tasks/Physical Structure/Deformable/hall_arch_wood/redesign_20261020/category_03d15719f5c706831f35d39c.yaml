public:
  objective: Use the working gripper to gently sweep the original cloth sideways until
    the covered item is exposed. Keep the item in its starting place while uncovering
    it. Then grasp the exposed item, lift it clear of its starting support and cloth,
    and hold it steadily.
  success_criteria: Make physical hand contact with the cloth, move it at least 10
    cm sideways and entirely clear the original item footprint with 2 cm margin before
    grasping the item. Hold the item with a real native grasp at least 5 cm above
    its starting height for 0.25 seconds.
  environment: The original cloth and covered item start together on an accessible
    support in the original room; asset sizes, floor and room furniture are retained.
  constraints:
  - Use only existing guarded base, arm, trunk and gripper controls.
  - Push or sweep with small hand motions; never remove, teleport or resize the cloth.
  - Keep the original room assets and floor geometry unchanged.
