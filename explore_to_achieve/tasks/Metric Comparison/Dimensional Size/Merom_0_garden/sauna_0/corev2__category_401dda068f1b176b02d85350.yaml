  objective: 'Which mug is larger: the one near the cactus, or the one near the ice
    cream cone? Compare the identical asset copies by their uniform linear dimensions;
    all dimensions scale together. Report "near the cactus" or "near the ice cream
    cone" before moving either copy. Select the original candidate that satisfies
    the comparison, transport it to the blue delivery table in this room, place it
    on top, release it and withdraw.'
  success_criteria: Report the correct initial comparison before moving candidates.
    Acquire the selected original object with the native gripper, then leave it stably
    released at the named destination for 15 consecutive native samples below 0.02
    m/s and 0.1 rad/s, with the robot withdrawn. Preserve all comparison references
    and the other candidate.
  environment: Explore the original scene using the robot mounted sensors and bounded
    controls. A blue delivery table is added without moving the source objects or
    furniture.
  constraints:
  - Compare the initial arrangement through mounted robot observations before intervention.
  - Preserve original asset scales, reference identities and all unselected comparison
    objects.
  - Use guarded native manipulation; source answers do not establish physical placement.
