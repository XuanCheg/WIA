public:
  objective: 'Build one stable three-object tower using the chopping board, shoe box,
    box of cookies. Choose a bottom object on the starting support surface. Grasp
    and lift each of the other two objects at least 5 cm, place one on the bottom
    and the last on the middle, lower into support contact before opening the gripper,
    then withdraw and leave the tower untouched for at least one second. You may test
    another order by physically unstacking and rebuilding. Original auxiliary question:
    How should you stack box_of_cookies, chopping_board, shoe_box to maximize stability?'
  success_criteria: All three objects are upright and form a supported tower in any
    stable order. The bottom touches the starting support surface; each upper touches
    and rests on its predecessor, with no other support. Both upper objects have real
    grasp, lift and release evidence. All robot hands are detached and withdrawn;
    the tower stays still for one continuous second. The original answer is scored
    separately as auxiliary QA.
  environment: The original room contains the three original-size objects on accessible
    starting supports.
  constraints:
  - Use only existing guarded base, arm, trunk, wrist and gripper controls.
  - Keep task object sizes and task supports unchanged. Noncritical native movable
    furniture may be moved using guarded arm and gripper actions.
  - Use real pick-and-place; legacy mock grasp and kinematic placement are excluded.
