public:
  objective: 'Grasp the avocado from its initialized pickup on the elevated complete
    ramp apparatus, lift it clear, lower it onto the ramp upper face until supported,
    release it and withdraw. Observe one uninterrupted second of stable, sliding or
    rolling motion; use the full selected apparatus deck as the safe runoff region.
    Original auxiliary question: Do you think the avocado will stay stable (not slide)
    when placed on the slope?'
  success_criteria: Perform a real grasp and at least 5 cm lift, supported top-face
    release, and one second without robot/other-object interference while the target
    remains on the complete apparatus. Intended slide, roll and runoff onto its safe
    deck may complete the trial. Escaping the deck or landing on the building floor
    fails. The auxiliary yes/no answer never substitutes for the physical trial.
  environment: The original target pickup and ramp move together onto one measured
    support with their source geometry, scale, mass, angle and materials retained.
    Source reference cameras share that translation. Robot approach, grasp access
    and safe runoff require native qualification.
  constraints:
  - Use only guarded base, arm and gripper controls; do not use legacy put_on_slope
    or simulator setters.
  - Preserve the complete ramp apparatus and the named safe runoff region.
requirements:
  capabilities:
  - base_translation
  - base_rotation
  - ee_translation
  - ee_rotation
  - trunk_height
  - gripper
