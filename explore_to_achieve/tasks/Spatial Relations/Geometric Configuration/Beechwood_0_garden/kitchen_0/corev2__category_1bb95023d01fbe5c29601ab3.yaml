public:
  objective: Arrange the jar of sugar, thyme shaker, vinegar bottle into a isosceles
    arrangement on their starting support. Use their horizontal bounding-box centers
    and physically rearrange the objects with the robot.
  success_criteria: Compare side lengths using 5% of the longest side. Equilateral
    requires all equal; isosceles requires an equal pair and a distinct third side;
    random triangle means all sides distinct. Twice the horizontal area divided by
    longest side squared must be at least 0.05. Every center pair must be farther
    apart than max(3 cm, 5% of the longest span). Object bounding boxes must have
    at least 5 mm horizontal clearance. Preserve asset scales, release every object,
    open the gripper, and keep supported objects below 0.02 m/s and 0.1 rad/s for
    15 consecutive native samples. Recorded native robot control and grasp/contact
    must cause object displacement exceeding the 3.5 cm initialization pose tolerance.
    Simulator state setters and initialization placement do not count as rearrangement.
  environment: The original objects, orientations, scales and room are retained. Their
    seeded initial arrangement deliberately fails the requested shape. Objects share
    a qualified support with space for grasping.
  constraints:
  - Use mounted observations and guarded robot controls.
  - Preserve the starting support and task objects; no resizing or collapsed overlapping
    formation.
  - The original initial-state question and answer remain historical evidence.
