public:
  objective: Inspect the violin and backpack. Finish with the violin separated by
    a positive gap from the backpack, with both objects stably resting on their starting
    support and the gripper empty and open. If this relation already holds, leave
    the objects in place and wait for the measured stable state. Otherwise manipulate
    the violin using the robot controls. Keep the backpack near its starting pose.
  success_criteria: Touching requires actual native pair contact without penetration
    deeper than the declared 1 mm solver tolerance. Separation requires no native
    pair contact and a strictly positive measured bounding-box clearance. Both objects
    must remain supported, within the source room and original pair neighborhood,
    with speeds at most 0.02 m/s and 0.1 rad/s for 15 consecutive native samples.
    Finish released with an empty open gripper. The partner remains within 3 cm and
    15 degrees of its starting pose throughout. No grasp, lift, movement or contact/separation
    cycle is required when already correct.
  environment: The original room, floor, two original-size assets, pair relative geometry
    and reference camera are retained. Initialization may translate both partners
    together onto an existing same-room support without resizing or changing their
    spacing. The original floor layout remains a historical variant. Record the initial
    contact assessment before moving anything as auxiliary QA.
  constraints:
  - Use robot-mounted sensors and existing guarded base, arm, trunk and gripper controls.
  - Manipulate the designated task object while preserving its partner and task supports.
    Noncritical native movable furniture may be moved using guarded arm and gripper
    actions.
  - Keep the manipulated object within 1.5 m horizontally of the episode-start pair
    midpoint; place it on the starting support beside its partner.
  - Initial QA and saved visual labels do not prove the final native relation.
  - Human review images, source maps, object names/poses and evaluator records remain
    private, outside Agent sensors.
