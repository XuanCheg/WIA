public:
  objective: 'Survey all 3 distinct targets along this route: Survey the red, green
    and blue table landmarks in the bathroom 0, changing viewpoint as needed. Remember
    actual first sightings; the listed landmarks do not prescribe encounter order.
    Target inventory: the bottle of soda at the red table; the jar of jam at the green
    table; the box of sanitary napkins at the blue table. Remember their first-observed
    order. After observing every target from an informative legal viewpoint, submit
    ANSWER: SURVEY_COMPLETE. A reproducible rank question will then be revealed. Identify
    that history-selected target, retrieve it, and place it on the blue-rimmed delivery
    tray.'
  success_criteria: 'Complete the informative survey without moving targets, resolve
    the revealed rank using your own first-encounter history, then grasp the same
    bound object and release it stably at the named destination. Submit the selected
    public target label as ANSWER: <label>. Simultaneous first encounters do not define
    an order and invalidate that order question.'
  environment: One continuous native episode; no actor replay or historical count
    answer is supplied. The colored target stations and named delivery surface are
    explicit initialized apparatus.
  constraints:
  - During the survey, preserve targets, furniture and apparatus; use legal mounted-view
    inspection.
  - After the follow-up, manipulate only the selected target through public controls.
  - No arbitrary travel distance, return trip or lift-height bonus is required.
requirements:
  capabilities:
  - base_translation
  - base_rotation
  - ee_translation
  - ee_rotation
  - trunk_height
  - gripper
