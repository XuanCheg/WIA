    using a public base translation or torso-height change until you see a new diagnostic
    feature; keep the blocker fixed. Determine whether the candidate is beer bottle
    or wine bottle body. Report its category as ANSWER: <category> before grasping
    it. Then grasp that same original candidate and release it on the countertop nearest
    the bar in this room.'
  success_criteria: Complete informative inspection, report the correct identity before
    target grasp, select the same bound original candidate, and leave it released
    and supported at the destination for 15 consecutive native samples. The final
    placement must still hold when you finish.
  environment: All eight mounted cameras and the frozen initial global image are available.
    The source object identity, dimensions, material and appearance-producing orientation
    are preserved; the declared complete task-prop group may be translated together
    onto a measured support.
