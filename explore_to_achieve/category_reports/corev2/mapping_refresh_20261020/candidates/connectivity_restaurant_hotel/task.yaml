public:
  objective: 'Explore the complete preserved building once in one continuous episode.

    goal_1: Are bathroom_0 and dining_room_0 adjacent, with a direct connection between
    them?

    goal_2: Are dining_room_0 and lobby_0 adjacent, with a direct connection between
    them?

    goal_3: Are corridor 0 (near dining room 0) and corridor 1 (near kitchen 0) adjacent,
    with a direct connection between them?

    goal_4: Are corridor 0 (near dining room 0) and lobby_0 adjacent, with a direct
    connection between them?

    goal_5: Are corridor 1 (near kitchen 0) and dining_room_0 adjacent, with a direct
    connection between them?'
  success_criteria: 'Inspect the queried anchors and report each distinct required
    room arrival while stably inside it. Shared unordered visits can satisfy multiple
    questions. Submit one final JSON answer sheet in one world_observation line: ANSWER:
    {"goal_1":"<answer>","goal_2":"<answer>","goal_3":"<answer>","goal_4":"<answer>","goal_5":"<answer>"}.
    Use each question''s source options shown below. Legacy ANSWER: goal_N=<answer>
    is accepted. No action or observation is required solely to answer another question.

    goal_1: Report a standalone ANSWER: <option> line in world_observation, choosing
    from: Yes, No. Answer direct adjacency: a No answer does not mean the rooms are
    globally unreachable. Each distinct required room is counted once; no return tour
    is required.

    goal_2: Report a standalone ANSWER: <option> line in world_observation, choosing
    from: Yes, No. Answer direct adjacency: a No answer does not mean the rooms are
    globally unreachable. Each distinct required room is counted once; no return tour
    is required.

    goal_3: Report a standalone ANSWER: <option> line in world_observation, choosing
    from: Yes, No. Answer direct adjacency: a No answer does not mean the rooms are
    globally unreachable. Each distinct required room is counted once; no return tour
    is required.

    goal_4: Report a standalone ANSWER: <option> line in world_observation, choosing
    from: Yes, No. Answer direct adjacency: a No answer does not mean the rooms are
    globally unreachable. Each distinct required room is counted once; no return tour
    is required.

    goal_5: Report a standalone ANSWER: <option> line in world_observation, choosing
    from: Yes, No. Answer direct adjacency: a No answer does not mean the rooms are
    globally unreachable. Each distinct required room is counted once; no return tour
    is required.'
  environment: The complete original building, furniture and native doors are retained.
    Use all eight mounted cameras and the initial Global overview.
  constraints:
  - Preserve original room boundaries, queried anchors and doorway geometry.
  - Use legal robot controls; door opening requires actual physical interaction.
