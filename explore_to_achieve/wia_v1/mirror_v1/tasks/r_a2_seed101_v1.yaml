    candidate_2:
      name: wia_mirror_candidate_2
      category: object
  evaluation:
    type: category_operation
    module: core.esi_converters.wia_mirror
    operation: classify_appearance_deliver
    binding_keys:
    - table
    - leg_0
    - leg_1
    - leg_2
    - leg_3
    - pad_blue
    - pad_yellow
    - mirror
    - mirror_post_0
    - mirror_post_1
    - anchor
    - cue_low
    - cue_high
    - cue_bottom
    - cue_top
    - candidate_0
    - candidate_1
    - candidate_2
    parameters:
      revision: wia_mirror_v1
      operation: classify_appearance_deliver
      candidates:
        candidate_0: wia_mirror_candidate_0
        candidate_1: wia_mirror_candidate_1
        candidate_2: wia_mirror_candidate_2
      candidate_dimensions_m:
        candidate_0:
        - 0.065
        - 0.065
        - 0.12
        candidate_1:
        - 0.065
        - 0.065
        - 0.12
        candidate_2:
        - 0.065
        - 0.065
        - 0.12
      fixture_keys:
      - table
      - leg_0
      - leg_1
      - leg_2
      - leg_3
      - pad_blue
      - pad_yellow
      - mirror
      - mirror_post_0
      - mirror_post_1
      - anchor
      - cue_low
      - cue_high
      - cue_bottom
      - cue_top
      scoring:
        minimum_lift_m: 0.05
        stability_duration_s: 0.5
        maximum_linear_speed_m_s: 0.02
        maximum_angular_speed_rad_s: 0.1
        max_sample_gap_s: 0.1
        fixture_position_tolerance_m: 0.002
        fixture_angle_tolerance_rad: 0.01
        dimension_relative_tolerance: 1.0e-05
        aperture_clearance_margin_m: 0.001
        minimum_assignment_gap_m: 0.015
        threshold_status: Explicit provisional development contract; native calibration and
          legal reference execution deferred until user review.
        unselected_position_tolerance_m: 0.02
        minimum_required_motion_m: 0.05
        selection_commitment: First post-begin native grasp commits the real object; a different
          candidate grasp violates single-target selection. Spatial swap requires both targets.
        optical_scope: Physical outcome and geometric selection are scored separately from
          optical visibility/necessity. No mirrored segmentation-mask proxy or source QA truth.
      table_key: table
      mirror_key: mirror
      cue_bindings:
        lower_side: cue_low
        upper_side: cue_high
        roof: cue_top
        floor: cue_bottom
      anchor_key: anchor
      destinations:
        blue: pad_blue
        yellow: pad_yellow
      appearance_mode: direct
      completion_items:
      - id: appearance_report
        kind: historical_checkpoint
      - id: selection
        kind: historical_checkpoint
      - id: grasp_lift
        kind: historical_checkpoint
      - id: stable_placement
        kind: terminal_condition
