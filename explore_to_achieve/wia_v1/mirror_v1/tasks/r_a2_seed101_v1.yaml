kind: category_robot_task
id: wia_appearance_delivery_v1
version: 1
status: pending
source:
  provider: esi
  json: Specular Reflection/Correspondence/hall_glass_ceiling/empty_room_0/q_007.json
public:
  objective: 'Inspect the grey block appearance inside the red outline in the initial head-camera
    view. Report ANSWER: reflected or ANSWER: direct before grasping a candidate. Deliver
    the corresponding real block to blue if the appearance is reflected, or to yellow if it
    is direct.'
  success_criteria: Report whether the initial framed appearance is reflected or direct before
    the first candidate grasp, and deliver the corresponding real block to the declared color.
    Use a genuine robot grasp to lift each required block at least 5 cm. Leave all required
    blocks supported and released without robot contact for at least 0.5 seconds, with linear
    speed at most 0.02 m/s and angular speed at most 0.1 rad/s. Leave the working hand empty
    and open, withdraw the robot hands from the blocks, and declare DONE.
  environment: A shared hall workstation with grey blocks, a physical mirror, a red outline,
    blue and yellow pads, and a fixed yellow reference pillar.
  constraints:
  - Keep the table, pads, mirror, red outline and yellow reference pillar fixed; preserve
    all object dimensions.
  - Use the existing guarded public controls and robot-mounted observations.
  - Interpret the requested appearance using the initial head-camera view. Later robot movement
    does not redefine the requested real block.
  - The first candidate grasp commits the real-object selection. Do not grasp a different
    candidate.
  - Keep each unselected block within 2 cm of its starting position.
requirements:
  capabilities:
  - base_translation
  - base_rotation
  - ee_translation
  - ee_rotation
  - trunk_height
  - gripper
private:
