kind: category_robot_task
id: wia_dimensional_d2_2_v2__control_family_v1__hall_glass_ceiling__seed202__i0_open
version: 3
status: pending
source:
  provider: esi
  json: Specular Reflection/Correspondence/hall_glass_ceiling/empty_room_0/q_007.json
public:
  objective: Sort all four grey blocks by their longest physical edge, irrespective of their
    current orientation. In ascending order place them on blue, yellow, purple and cyan. Grasp,
    lift, release and withdraw for every block.
  success_criteria: Use a real robot grasp to lift each required block at least 5 cm. Finish
    with every required block supported on its assigned pad, released without robot contact,
    and stable for at least 0.5 seconds with linear speed at most 0.02 m/s and angular speed
    at most 0.1 rad/s. Leave the working hand empty and open, withdraw all robot hands from
    the placed blocks, and declare DONE.
  environment: The shared hall workstation with grey blocks and blue, yellow, purple and cyan
    pads.
  constraints:
  - Preserve all block dimensions and all fixed tables, legs, pads and frames.
  - Use the existing guarded public robot controls and the observed block shapes and pad colors.
  - Compare each block by its intrinsic longest physical edge, independent of its current
    orientation. Complete a genuine grasp, lift and released placement for every block.
requirements:
  capabilities:
  - base_translation
  - base_rotation
  - ee_translation
  - ee_rotation
  - trunk_height
  - gripper
