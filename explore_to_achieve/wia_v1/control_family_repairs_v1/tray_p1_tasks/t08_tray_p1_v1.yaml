public:
  objective: 'Visit bathroom 0, then shared office 0, then corridor 0, then conference hall
    0, in that order. In each designated room, pick up the selected object: lavender oil bottle
    in bathroom 0; miniature orange juice bottle in shared office 0; miniature cola bottle
    in corridor 0; banana in conference hall 0. Place every selected object on the tray held
    in your right hand.'
  success_criteria: Finish with all selected objects physically resting on the tray, your
    left hand released, and the tray held steadily in your right hand.
  environment: Original furnished rooms and doors, with objects on openly exposed supporting
    surfaces.
  constraints:
  - Keep the tray in your right hand and use your left hand to pick and place.
  - Pick up each selected object while you and the object are in its designated room.
  - Only the selected physical objects count; repeated views do not create additional objects.
  - Complete both the room visits and the object pickups in the declared room order.
