public:
  objective: 'Which container does the gift box best fit inside: the large packing box or the medium packing
    box or the small packing box? Place each named object partially inside its selected container. Leave
    it released and withdraw the robot hands at least 2 cm clear.'
  success_criteria: 'Answer the original containment question for every named object. For each object,
    verify partial insertion into its selected container with actual container contact and no interpenetration.
    With empty open hands, no robot support or contact and hands at least 2 cm clear, maintain this state
    for at least 0.5 seconds with linear speed at most 0.02 m/s and angular speed at most 0.1 rad/s. An
    object resting entirely on top does not count. No minimum lift height or prior grasp is required.
    Targets may be verified sequentially and removed after verification to free a shared container. Finish
    with empty open hands. Submit ANSWER: <container label> and declare DONE.'
  environment: The gift box is exposed on the left upholstered armchair (sofa seat). The three packing
    boxes remain on the native white table. Retrieve the target using the real R1 robot.
  constraints:
  - Complete every target subtask before declaring DONE. An object resting entirely on top does not count
    as inside.
  - Use the existing guarded public robot controls and visible object/container labels.
  - Preserve all asset scales and keep every container within 2 cm and 0.05 radians of its starting pose.
  - Targets may be verified sequentially. An object may be removed after its released, stable partial
    insertion has been completely verified, to free a shared container. Simultaneous packing is not required.
