public:
  objective: Follow this supplied order. Choose one pizza box as the base for B (the
    casserole). Grasp B, lift it at least 5 cm, then place and release it on the chosen
    base until stable. Then choose one pear, grasp and lift it at least 5 cm, and
    place and release it on top of B until the whole stack is stable.
  success_criteria: Either original candidate of each category is acceptable when
    the chosen objects genuinely form the requested support order after the ordered
    grasp, lift and placement operations. The freestanding stack must remain in supporting
    contact with low motion for at least 0.5 seconds after release.
  environment: The original room contains two pizza box candidates and one casserole
    called B. There are two pear candidates.
  constraints:
  - Use robot motion and gripper interaction to move objects.
  - Finish placing B before grasping the chosen top object.
  - Recover unsuccessful placements with robot grasping and retry as needed.
  - Leave all grippers released and clear of the finished stack.
