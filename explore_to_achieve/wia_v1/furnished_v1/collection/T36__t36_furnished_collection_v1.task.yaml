    and the tray held steadily in your right hand.
  environment: Original furnished rooms and doors, with objects on openly exposed supporting surfaces.
  constraints:
  - Keep the tray in your right hand. Use your left hand to pick and place.
  - Collect every target category object you find in the declared search rooms.
  - The target count is unknown. Repeated views of one physical object count only once.
