kind: category_robot_task
id: wia_household_appearance_delivery_seed202_v4
version: 1
status: pending
source:
  provider: esi
  json: Specular Reflection/Correspondence/office_cubicles_left/meeting_room_0/wia_furnished_background_v1.json
public:
  objective: 'Inspect the salt shaker appearance inside the red outline in the initial head-camera
    view. Report ANSWER: reflected or ANSWER: direct before grasping a candidate. Deliver
    the corresponding real salt shaker to blue if the appearance is reflected, or to yellow
    if it is direct.'
  success_criteria: Report whether the initial framed appearance is reflected or direct before
    the first candidate grasp, and deliver the corresponding real salt shaker to the declared
    color. Use a genuine robot grasp to lift each required salt shaker at least 5 cm. Leave
    all required salt shakers supported and released without robot contact for at least 0.5
    seconds, with linear speed at most 0.02 m/s and angular speed at most 0.1 rad/s. Leave
    the working hand empty and open, withdraw the robot hands from the salt shakers, and declare
    DONE.
  environment: A furnished meeting room with salt shakers on a fixed deck over an existing
    native table, a physical mirror, a red rectangular outline, blue and yellow delivery pads,
    and a fixed yellow reference pillar.
  constraints:
  - Keep the table, pads, mirror, red outline and yellow reference pillar fixed; preserve
    all object dimensions.
  - Use the existing guarded public controls and robot-mounted observations.
  - Interpret the requested appearance using the initial head-camera view. Later robot movement
    does not redefine the requested real salt shaker.
  - The first candidate grasp commits the real-object selection. Do not grasp a different
    candidate.
  - Keep each unselected salt shaker within 2 cm of its starting position.
requirements:
  capabilities:
  - base_translation
  - base_rotation
  - ee_translation
  - ee_rotation
  - trunk_height
  - gripper
private:
  bindings:
    table:
      name: wia_mirror_table
      category: table
    mirror:
      name: wia_mirror_panel
      category: object
    pad_blue:
