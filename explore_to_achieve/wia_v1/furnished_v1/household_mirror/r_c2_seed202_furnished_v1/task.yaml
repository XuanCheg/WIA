    - mirror
    - pad_blue
    - pad_yellow
    - anchor
    - cue_low
    - cue_high
    - cue_bottom
    - cue_top
    - candidate_0
    - candidate_1
    - candidate_2
    - candidate_3
    parameters:
      revision: wia_mirror_v3
      operation: mirror_select_deliver
      candidates:
        candidate_0: wia_mirror_candidate_0
        candidate_1: wia_mirror_candidate_1
        candidate_2: wia_mirror_candidate_2
        candidate_3: wia_mirror_candidate_3
      fixture_keys:
      - table
      - mirror
      - pad_blue
      - pad_yellow
      - anchor
      - cue_low
      - cue_high
      - cue_bottom
      - cue_top
      scoring:
        minimum_lift_m: 0.05
        stability_duration_s: 0.5
        maximum_linear_speed_m_s: 0.02
        maximum_angular_speed_rad_s: 0.1
        max_sample_gap_s: 0.1
        fixture_position_tolerance_m: 0.002
        fixture_angle_tolerance_rad: 0.01
        dimension_relative_tolerance: 1.0e-05
        aperture_clearance_margin_m: 0.001
        minimum_assignment_gap_m: 0.015
        threshold_status: Explicit provisional development contract; native calibration and
          legal reference execution deferred until user review.
        unselected_position_tolerance_m: 0.02
        minimum_required_motion_m: 0.05
        selection_commitment: First post-begin native grasp commits the real object; a different
          candidate grasp violates single-target selection. Spatial swap requires both targets.
        optical_scope: Physical outcome and geometric selection are scored separately from
          optical visibility/necessity. No mirrored segmentation-mask proxy or source QA truth.
      table_key: table
      mirror_key: mirror
      cue_bindings:
        lower_side: cue_low
        upper_side: cue_high
        roof: cue_top
        floor: cue_bottom
      anchor_key: anchor
      destinations:
