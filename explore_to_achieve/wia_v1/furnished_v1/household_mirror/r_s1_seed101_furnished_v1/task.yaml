kind: category_robot_task
id: wia_household_r_s1_seed101_v1
version: 1
status: pending
source:
  provider: esi
  json: Specular Reflection/Correspondence/Beechwood_0_garden/dining_room_0/wia_furnished_background_v1.json
public:
  objective: Identify the real oatmeal box whose reflection is inside the red outline in the
    initial head-camera view. Move that oatmeal box so it is at least 20 cm farther from the
    fixed yellow reference pillar than the other oatmeal box. Grasp and lift it, then leave
    both oatmeal boxes stably released on the worktable. Keep the other oatmeal box in place.
  success_criteria: Use a genuine robot grasp to lift each required oatmeal box at least 5
    cm. Leave all required oatmeal boxes supported and released without robot contact for
    at least 0.5 seconds, with linear speed at most 0.02 m/s and angular speed at most 0.1
    rad/s. Leave the working hand empty and open, withdraw the robot hands from the oatmeal
    boxes, and declare DONE.
  environment: A furnished dining room with oatmeal boxes on a fixed deck over an existing
    native table, a physical mirror, a red rectangular outline, blue and yellow delivery pads,
    and a fixed yellow reference pillar.
  constraints:
  - Keep the table, pads, mirror, red outline and yellow reference pillar fixed; preserve
    all object dimensions.
  - Use the existing guarded public controls and robot-mounted observations.
  - Interpret the requested appearance using the initial head-camera view. Later robot movement
    does not redefine the requested real oatmeal box.
  - The first candidate grasp commits the real-object selection. Do not grasp a different
    candidate.
  - Keep each unselected oatmeal box within 2 cm of its starting position.
  - Move the selected real oatmeal box at least 5 cm from its starting position.
  - Measure distances in the horizontal plane from each real oatmeal box to the fixed yellow
    pillar.
requirements:
  capabilities:
  - base_translation
  - base_rotation
  - ee_translation
  - ee_rotation
  - trunk_height
  - gripper
