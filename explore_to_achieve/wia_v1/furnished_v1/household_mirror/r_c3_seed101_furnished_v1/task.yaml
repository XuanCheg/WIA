kind: category_robot_task
id: wia_household_r_c3_seed101_v1
version: 1
status: pending
source:
  provider: esi
  json: Specular Reflection/Correspondence/house_single_floor/dining_room_0/wia_furnished_background_v1.json
public:
  objective: The bananas have the same shape but different orientations. Find the real banana
    corresponding to the reflection in the red outline in the initial head-camera view. Grasp,
    lift and deliver it to the blue pad.
  success_criteria: Use a genuine robot grasp to lift each required banana at least 5 cm.
    Leave all required bananas supported and released without robot contact for at least 0.5
    seconds, with linear speed at most 0.02 m/s and angular speed at most 0.1 rad/s. Leave
    the working hand empty and open, withdraw the robot hands from the bananas, and declare
    DONE.
  environment: A furnished dining room with bananas on a fixed deck over an existing native
    table, a physical mirror, a red rectangular outline, blue and yellow delivery pads, and
    a fixed yellow reference pillar.
  constraints:
  - Keep the table, pads, mirror, red outline and yellow reference pillar fixed; preserve
    all object dimensions.
  - Use the existing guarded public controls and robot-mounted observations.
  - Interpret the requested appearance using the initial head-camera view. Later robot movement
    does not redefine the requested real banana.
  - The first candidate grasp commits the real-object selection. Do not grasp a different
    candidate.
  - Keep each unselected banana within 2 cm of its starting position.
requirements:
  capabilities:
  - base_translation
  - base_rotation
  - ee_translation
  - ee_rotation
  - trunk_height
  - gripper
