      fixture_keys:
      - table
      - mirror
      - pad_blue
      - pad_yellow
      - anchor
      - cue_low
      - cue_high
      - cue_bottom
      - cue_top
      scoring:
        minimum_lift_m: 0.05
        stability_duration_s: 0.5
        maximum_linear_speed_m_s: 0.02
        maximum_angular_speed_rad_s: 0.1
        max_sample_gap_s: 0.1
        fixture_position_tolerance_m: 0.002
