kind: category_robot_task
id: wia_household_r_s3_seed101_v2
version: 1
status: pending
source:
  provider: esi
  json: Specular Reflection/Correspondence/house_single_floor/dining_room_0/wia_furnished_background_v1.json
public:
  objective: Use the mirror to identify the two pepper grinders and their initial order relative
    to the fixed yellow reference pillar. Swap which pepper grinder is closer to that pillar,
    with at least a 20 cm distance gap. Grasp and lift both real pepper grinders and leave
    both stably released on the worktable. Moving the robot does not change the reference.
  success_criteria: Use a genuine robot grasp to lift each required pepper grinder at least
    5 cm. Leave all required pepper grinders supported and released without robot contact
    for at least 0.5 seconds, with linear speed at most 0.02 m/s and angular speed at most
    0.1 rad/s. Leave the working hand empty and open, withdraw the robot hands from the pepper
    grinders, and declare DONE.
  environment: A furnished dining room with pepper grinders on a fixed deck over an existing
    native table, a physical mirror, a red rectangular outline, blue and yellow delivery pads,
    and a fixed yellow reference pillar.
  constraints:
  - Keep the table, pads, mirror, red outline and yellow reference pillar fixed; preserve
    all object dimensions.
  - Use the existing guarded public controls and robot-mounted observations.
  - Interpret the requested appearance using the initial head-camera view. Later robot movement
    does not redefine the requested real pepper grinder.
  - Grasp and lift both real pepper grinders. Move each pepper grinder at least 5 cm from
    its starting position.
  - Measure the final distance order in the horizontal plane relative to the fixed yellow
    pillar; moving the robot does not establish progress.
requirements:
  capabilities:
  - base_translation
  - base_rotation
  - ee_translation
  - ee_rotation
  - trunk_height
  - gripper
