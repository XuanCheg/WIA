kind: category_robot_task
id: wia_household_r_s2_seed202_v2
version: 1
status: pending
source:
  provider: esi
  json: Specular Reflection/Correspondence/office_cubicles_left/meeting_room_0/wia_furnished_background_v1.json
public:
  objective: Identify the real orange juice bottle whose reflection is inside the red outline
    in the initial head-camera view. Move that orange juice bottle so it is at least 10 cm
    closer to the fixed yellow reference pillar than the other orange juice bottle. Grasp
    and lift it, then leave both orange juice bottles stably released on the worktable. Keep
    the other orange juice bottle in place.
  success_criteria: Use a genuine robot grasp to lift each required orange juice bottle at
    least 5 cm. Leave all required orange juice bottles supported and released without robot
    contact for at least 0.5 seconds, with linear speed at most 0.02 m/s and angular speed
    at most 0.1 rad/s. Leave the working hand empty and open, withdraw the robot hands from
    the orange juice bottles, and declare DONE.
  environment: A furnished meeting room with orange juice bottles on a fixed deck over an
    existing native table, a physical mirror, a red rectangular outline, blue and yellow delivery
    pads, and a fixed yellow reference pillar.
  constraints:
  - Keep the table, pads, mirror, red outline and yellow reference pillar fixed; preserve
    all object dimensions.
  - Use the existing guarded public controls and robot-mounted observations.
  - Interpret the requested appearance using the initial head-camera view. Later robot movement
    does not redefine the requested real orange juice bottle.
  - The first candidate grasp commits the real-object selection. Do not grasp a different
    candidate.
  - Keep each unselected orange juice bottle within 2 cm of its starting position.
  - Move the selected real orange juice bottle at least 5 cm from its starting position.
  - Measure distances in the horizontal plane from each real orange juice bottle to the fixed
    yellow pillar.
requirements:
  capabilities:
  - base_translation
  - base_rotation
  - ee_translation
  - ee_rotation
  - trunk_height
  - gripper
