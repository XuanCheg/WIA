        selection_commitment: First post-begin native grasp commits the real object; a different
          candidate grasp violates single-target selection. Spatial swap requires both targets.
        optical_scope: Physical outcome and geometric selection are scored separately from
          optical visibility/necessity. No mirrored segmentation-mask proxy or source QA truth.
