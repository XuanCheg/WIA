public:
  objective: Retrieve the items from exposed room furniture. Follow this supplied order. Choose
    one pizza box as the base for B (the wicker basket). Grasp B, separate it from its current
    support, then place and release it on the chosen base until stable. Then choose one lemon,
    grasp and separate it from its current support, and place and release it on top of B until
    the whole stack is stable.
  success_criteria: Either original candidate of each category is acceptable when the chosen
    objects genuinely form the requested support order after the ordered grasp, support separation
    and placement operations. The freestanding stack must remain in supporting contact with
    low motion for at least 0.5 seconds after release. A fixed lift height is not required.
    Native evidence must show the selected object genuinely held clear of external and candidate
    supports before its later release.
  environment: A furnished kitchen with the task items openly dispersed on exposed native
    furniture surfaces. The items are not deliberately hidden.
  constraints:
  - Use robot motion and gripper interaction to move objects.
  - Finish placing B before grasping the chosen top object.
  - Recover unsuccessful placements with robot grasping and retry as needed.
  - Leave all grippers released and clear of the finished stack.
requirements:
  capabilities:
  - base_translation
  - base_rotation
  - ee_translation
  - gripper
