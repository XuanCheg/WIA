public:
  objective: 'Which container does the first aid kit best fit inside: the packing box or the
    mug or the tote? For every named object, perform a real robot grasp, lift it at least
    5 cm, and partially insert it into the container selected for that object. Release it
    and withdraw the robot hands at least 2 cm clear.'
  success_criteria: 'Answer the original containment question for every named object. For
    each object, complete an actual grasp and a lift of at least 5 cm, then release it partially
    inside its selected container while touching that container. With no robot contact or
    support, and the robot hands at least 2 cm clear, maintain this state for at least 0.5
    seconds with linear speed at most 0.02 m/s and angular speed at most 0.1 rad/s. An object
    resting entirely on top does not count as inside. Finish with empty hands and the working
    gripper open. Submit ANSWER: <container label> and declare DONE.'
  environment: Retrieve the target objects using the real R1 robot.
  constraints:
  - Complete every target subtask before declaring DONE. An object resting entirely on top
    does not count as inside.
  - Use the existing guarded public robot controls and visible object/container labels.
  - Preserve all asset scales and keep every container within 2 cm and 0.05 radians of its
    starting pose.
  - Targets may be verified sequentially. An object may be removed after its released, stable
    partial insertion has been completely verified, to free a shared container. Simultaneous
    packing is not required.
