public:
  objective: Retrieve the items from exposed room furniture. Follow this supplied order. Choose
    one pizza box as the base for B (the casserole). Grasp B, lift it at least 5 cm, then
    place and release it on the chosen base until stable. Then choose one pear, grasp and
    lift it at least 5 cm, and place and release it on top of B until the whole stack is stable.
  success_criteria: Either original candidate of each category is acceptable when the chosen
    objects genuinely form the requested support order after the ordered grasp, lift and placement
    operations. The freestanding stack must remain in supporting contact with low motion for
    at least 0.5 seconds after release.
  environment: A furnished utility room with the task items openly dispersed on exposed native
    furniture surfaces. The items are not deliberately hidden.
  constraints:
  - Use robot motion and gripper interaction to move objects.
  - Finish placing B before grasping the chosen top object.
  - Recover unsuccessful placements with robot grasping and retry as needed.
  - Leave all grippers released and clear of the finished stack.
requirements:
  capabilities:
  - base_translation
  - base_rotation
  - ee_translation
  - gripper
