    - leg_0
    - leg_1
    - leg_2
    - leg_3
    - pad_0
    - aperture_low
    - aperture_high
    - aperture_roof
    - candidate_0
    - candidate_1
    parameters:
      revision: wia_dimensional_v1
      operation: select_pass_aperture
      candidates:
        candidate_0: wia_dim_candidate_0
        candidate_1: wia_dim_candidate_1
      destinations:
      - pad_0
      scoring:
        minimum_lift_m: 0.05
        stability_duration_s: 0.5
        maximum_linear_speed_m_s: 0.02
        maximum_angular_speed_rad_s: 0.1
        max_sample_gap_s: 0.1
        fixture_position_tolerance_m: 0.002
        fixture_angle_tolerance_rad: 0.01
        dimension_relative_tolerance: 1.0e-05
        aperture_clearance_margin_m: 0.001
        minimum_assignment_gap_m: 0.015
        threshold_status: Explicit provisional development contract; native calibration and
          legal reference execution deferred until user review.
      unselected_position_tolerance_m: 0.02
      fixture_keys:
      - table
      - leg_0
      - leg_1
      - leg_2
      - leg_3
      - pad_0
      - aperture_low
      - aperture_high
      - aperture_roof
      candidate_dimensions_m:
