kind: category_robot_task
id: wia_dimensional_d1_3_v1
version: 1
status: pending
source:
  provider: esi
  json: Specular Reflection/Correspondence/hall_glass_ceiling/empty_room_0/q_007.json
public:
  objective: Choose a block and orient it to pass through the entire narrow tunnel. Grasp
    and lift it, enter through the near opening, exit beyond the far opening, and release
    it on the blue pad.
  success_criteria: The selected block must physically enter the near opening, traverse the
    frame depth, and fully exit through the far opening before its final supported release
    on blue. Use a real robot grasp to lift each required block at least 5 cm. Finish with
    every required block supported on its assigned pad, released without robot contact, and
    stable for at least 0.5 seconds with linear speed at most 0.02 m/s and angular speed at
    most 0.1 rad/s. Leave the working hand empty and open, withdraw all robot hands from the
    placed blocks, and declare DONE.
  environment: A hall workstation with grey blocks, a fixed framed opening and a blue delivery
    pad.
  constraints:
  - Preserve all block dimensions and all fixed tables, legs, pads and frames.
  - Use the existing guarded public robot controls and the observed block shapes and pad colors.
  - The first candidate block you grasp commits your selection. Keep the unselected block
    within 2 cm of its starting position.
  - Rotation is allowed. Pass the selected block through the opening; do not route it around
    the frame.
  - The selected block may be released before passage is complete if it subsequently completes
    the physical traversal and finishes on blue. The robot hand itself need not pass through
    the opening.
requirements:
  capabilities:
  - base_translation
  - base_rotation
  - ee_translation
  - ee_rotation
  - trunk_height
  - gripper
