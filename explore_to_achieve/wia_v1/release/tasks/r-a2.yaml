kind: category_robot_task
id: wia_produce_appearance_seed101
version: 6
status: pending
source:
  provider: esi
  json: Specular Reflection/Correspondence/office_cubicles_left/meeting_room_0/wia_furnished_background_v1.json
public:
  objective: 'Inspect the produce appearance inside the red outline in the initial head-camera view. Submit
    ANSWER: reflected or ANSWER: direct. Deliver the corresponding real item inside the stockpot if reflected,
    or onto the cutting board if direct.'
  success_criteria: Leave all required original items in the branch-correct destination and requested
    spatial relation, released without robot support and stable for at least 0.5 seconds, with linear
    speed at most 0.02 m/s and angular speed at most 0.1 rad/s. Finish with empty open hands, withdrawn
    from the objects. No minimum lift height, travel distance, prior grasp or first-grasp commitment is
    required. Declare DONE.
  environment: A furnished meeting room with vegetables or fruit on native furniture, a real mirror, a
    stockpot, and a cutting board.
  constraints:
  - Keep the mirror, red outline, stockpot, cutting board and furniture fixed. Preserve item shapes and
    sizes.
  - Use the initial head-camera view to interpret the red outline; later robot motion does not change
    the requested identity.
  - Use guarded public controls and mounted observations. At completion, unselected produce must be within
    2 cm of its initial position.
requirements:
  capabilities:
  - base_translation
  - base_rotation
  - ee_translation
  - ee_rotation
  - trunk_height
  - gripper
