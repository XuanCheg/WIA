public:
  objective: 'Find the target on the exposed furniture surface and inspect the containers distributed
    along the other counter. Which container does the first aid kit best fit inside: the packing box or
    the mug or the tote? Place each named object partially inside its selected container. Leave it released
    and withdraw the robot hands at least 2 cm clear.'
  success_criteria: Answer the original containment question for every named object. If several containers
    permit stable partial insertion, choose the smaller suitable one. For each object, verify partial
    insertion into its selected container with actual container contact and no interpenetration. With
    both hands empty, the working gripper open, no robot support or contact and both hands at least 2
    cm clear, maintain this state for at least 0.5 seconds with linear speed at most 0.02 m/s and angular
    speed at most 0.1 rad/s. An object resting entirely on top does not count. No minimum lift height
    or prior grasp is required. Targets may be verified sequentially and removed after verification to
    free a shared container. Finish with both hands empty and the working gripper open. Return the selected
    container label in the answer field and declare DONE.
  environment: A furnished utility room. The target and containers occupy separate native furniture surfaces;
    none is deliberately hidden.
  constraints:
  - Complete every target subtask before declaring DONE. An object resting entirely on top does not count
    as inside.
  - Use the existing guarded public robot controls and visible object/container labels.
  - Preserve all asset scales and keep every container within 2 cm and 0.05 radians of its starting pose.
  - Targets may be verified sequentially. An object may be removed after its released, stable partial
    insertion has been completely verified, to free a shared container. Simultaneous packing is not required.
