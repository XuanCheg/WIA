public:
  objective: 'Retrieve the items from exposed room furniture. Build one stable three-object tower using
    the chopping board, shoe box, box of cookies. Arrange the three objects into any upright, stable tower
    on the starting support surface. Leave all hands released and withdrawn and the tower stable for at
    least one second. Original auxiliary question: How should you stack box_of_cookies, chopping_board,
    shoe_box to maximize stability?'
  success_criteria: All three original objects are upright and form a supported tower in any stable order.
    The bottom touches the starting support surface; each upper touches and rests on its predecessor,
    with no other support. All robot hands are detached and withdrawn; the tower stays still for one continuous
    second. No minimum lift height, grasp history or release sequence is required. The original answer
    remains auxiliary QA.
  environment: A furnished utility room with the task items openly dispersed on exposed native furniture
    surfaces. The items are not deliberately hidden.
  constraints:
  - Use only existing guarded base, arm, trunk, wrist and gripper controls.
  - Keep task object sizes and task supports unchanged. Noncritical native movable furniture may be moved
    using guarded arm and gripper actions.
