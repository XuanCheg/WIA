public:
  objective: 'Find the target on the exposed furniture surface and inspect the containers
    distributed along the other counter. Which container does the banana best fit
    inside: the wicker basket or the bowl or the tupperware? Grasp the banana with
    the robot, lift it at least 5 cm, and partially insert it into your chosen container.
    Release it and withdraw the gripper at least 2 cm clear of the banana.'
  success_criteria: 'Answer the original containment question and complete a real
    grasp, a lift of at least 5 cm, and stable partial insertion into the chosen container.
    After release, keep the banana partially inside with the gripper at least 2 cm
    clear for at least 0.5 seconds, with linear speed at most 0.02 m/s and angular
    speed at most 0.1 rad/s. An object resting entirely on top does not count as inside.
    Submit ANSWER: <container label> and declare DONE.'
  environment: A furnished playroom. The target and containers occupy separate native
    furniture surfaces; none is deliberately hidden.
  constraints:
  - Complete every target subtask before declaring DONE. An object resting entirely
    on top does not count as inside.
  - Use the existing guarded robot controls and visible container labels.
  - Preserve all asset scales and keep every container within 2 cm and 0.05 radians
    of its starting pose.
  - The banana may be removed after its released, stable partial insertion has been
    verified.
