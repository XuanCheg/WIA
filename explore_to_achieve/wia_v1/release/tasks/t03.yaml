public:
  objective: Build a stable stack with the casserole called B supported by either original pizza box.
    Place either original pear on top of B. You may complete the stack anywhere on a stable supporting
    surface. The chosen base may remain where it starts.
  success_criteria: The selected original objects must form the requested support order, with each upper
    object supported only by its predecessor and the base supported by a stable surface. Leave the stack
    released, clear of robot contact, and stable for at least 0.5 seconds. Success depends on the final
    structure; there is no minimum lift height, required grasp history, intermediate placement checkpoint
    or prescribed action order.
  environment: A furnished utility room with the task items openly dispersed on exposed native furniture
    surfaces. The items are not deliberately hidden.
  constraints:
  - Use guarded public robot controls to arrange the objects.
  - Preserve all original object sizes.
  - Leave all grippers released and clear of the finished stack.
