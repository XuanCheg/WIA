public:
  objective: Find the lime juice bottle, bottle of vinegar, jar of jam on open furniture surfaces. Bring
    them to the blue-grey tray on the counter. Arrange their centers into equilateral.
  success_criteria: Leave every original target fully inside the usable tray deck, in the requested relation,
    with actual nonpenetrating deck support. Leave hands empty, open and clear and the objects stable
    for at least 0.5 seconds. No minimum lift height, travel distance or prior grasp is required.
  environment: A furnished kitchen. Target objects are on exposed surfaces and are not deliberately hidden.
  constraints:
  - Use lawful robot controls and mounted observations.
  - Keep the tray and its supporting furniture fixed.
  - The tray is a fixed destination on furniture, not a hand-held collection tray.
