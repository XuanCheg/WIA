public:
  objective: The hand towel covers a tomato and a plain bun. Gently move the hand towel to
    expose and identify the tomato without moving either covered item. Then grasp the tomato
    and place it on the blue-rimmed delivery tray. Leave the plain bun on its starting support.
  success_criteria: Reveal the tomato through genuine hand-driven hand towel motion before
    grasping it. Lift it at least 5 cm and hold it for 0.25 seconds, then release it stably
    on the delivery tray. Keep the plain bun on its original support.
  environment: The covered items start under a hand towel on an accessible support, with a
    separate delivery tray.
  constraints:
  - Use only existing guarded base, arm, trunk and gripper controls.
  - Push or sweep with small hand motions; never remove, teleport or resize the hand towel.
  - Keep the original room assets and floor geometry unchanged.
requirements:
