public:
  objective: Find the violin, backpack on open furniture surfaces. Bring them to the blue-grey
    tray on the counter. Leave the two objects separated by at least 5 cm.
  success_criteria: Retrieve each target with a genuine grasp and at least 5 cm lift, then
    release all targets entirely on the tray deck in the requested relation. Leave hands clear
    and objects stable for at least 0.5 seconds.
  environment: A furnished kitchen. Target objects are on exposed surfaces and are not deliberately
    hidden.
  constraints:
  - Use lawful robot controls and mounted observations.
  - Keep the tray and its supporting furniture fixed.
  - The tray is a fixed destination on furniture, not a hand-held collection tray.
