public:
  objective: 'Comparing Phase 1 and Phase 2, did the contents of any comparison box change?


    Phase 1: freely inspect comparison locations in a read-only survey of at most 10 decisions.
    Use mounted cameras, base/torso motion and empty arms; preserve all objects and furniture.
    Choose DONE or submit PHASE1_COMPLETE when ready; the event occurs unobserved in this
    same episode. Phase 2: compare with memory and submit ANSWER: <original option>. Then
    perform the applicable operation: if an object was added, put the actual added object
    on the collection and inspection tray; if replaced, put the current replacement on the
    collection and inspection tray; if moved, return the displaced object to its remembered
    original container/support; if removed, select the matching category and model by appearance
    from the public spare inventory and replenish the remembered original location; if unchanged,
    inspect all comparison locations with informative views and leave the contents in place.
    No grasp is required for no-change. If several locations changed, complete the applicable
    operation for each change. You may finish Phase 1 before visiting every location; the
    phase switches automatically after ten decisions. Survey coverage is recorded but is not
    a transition or full-success gate. The spare tray contains the complete candidate inventory
    from the beginning in every event variant. Public spare inventory: spare 1 on the stocked
    spare tray: shaker; spare 2 on the stocked spare tray: jar of cumin; spare 3 on the stocked
    spare tray: butter; spare 4 on the stocked spare tray: bottle of lavender oil. The spare
    table is visible and reachable during both phases. Original answer options: ["yes", "no"]'
  success_criteria: Use informative observations in both phases, report the correct original
    comparison answer, and complete the applicable change-dependent operation. Manipulation
    requires real selection of the history-bound object and stable released placement with
    native destination support/contact. Preserve all other source contents, spare distractors,
    containers and furniture. Inspection-only no-change requires informative comparison-location
    views, never a fabricated pickup.
  environment: A furnished dining room with the original temporal task objects on an existing
    native table and the inherited physical apparatus.
  constraints:
  - Phase 1 is bounded to 10 decisions and strictly read-only, including the spare inventory.
  - The hidden event delivers no intermediate frames. Use only public guarded controls afterward.
  - There is no extra minimum travel distance, arbitrary any-container visit or return-to-start
    requirement.
  - Do not move any source object other than the comparison-selected target; preserve apparatus
    and distractors.
requirements:
  capabilities:
  - base_translation
  - base_rotation
  - ee_translation
  - gripper
  - ee_rotation
  - trunk_height
