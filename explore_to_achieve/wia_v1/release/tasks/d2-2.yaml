kind: category_robot_task
id: wia_dimensional_d2_2_v2
version: 5
status: pending
source:
  provider: esi
  json: Specular Reflection/Correspondence/hall_train_station/empty_room_0/wia_background_v1.json
public:
  objective: Sort all four grey blocks by their longest physical edge, irrespective of their current orientation.
    In ascending order place them on blue, yellow, purple and cyan.
  success_criteria: Finish with every required block supported on its assigned pad, released without robot
    contact, and stable for at least 0.5 seconds with linear speed at most 0.02 m/s and angular speed
    at most 0.1 rad/s. Leave the working hand empty and open, withdraw all robot hands from the placed
    blocks, and declare DONE. No minimum lift height or prior grasp is required.
  environment: The shared hall workstation with grey blocks and blue, yellow, purple and cyan pads.
  constraints:
  - Preserve all block dimensions and all fixed tables, legs, pads and frames.
  - Use the existing guarded public robot controls and the observed block shapes and pad colors.
  - Compare each block by its intrinsic longest physical edge, independent of its current orientation.
requirements:
  capabilities:
  - base_translation
  - base_rotation
  - ee_translation
  - ee_rotation
  - trunk_height
  - gripper
