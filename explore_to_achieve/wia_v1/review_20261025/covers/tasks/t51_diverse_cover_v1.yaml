public:
  objective: Use the working gripper to gently sweep the small tablecloth sideways until the
    covered item is exposed. Keep the item in its starting place while uncovering it. Then
    grasp the exposed item, lift it clear of its starting support and small tablecloth, and
    hold it steadily.
  success_criteria: Make physical hand contact with the small tablecloth, move it at least
    10 cm sideways and entirely clear the original item footprint with 2 cm margin before
    grasping the item. Hold the item with a real native grasp at least 5 cm above its starting
    height for 0.25 seconds.
  environment: The item starts fully covered by a small tablecloth on an accessible support
    in the room.
  constraints:
  - Use only existing guarded base, arm, trunk and gripper controls.
  - Push or sweep with small hand motions; never remove, teleport or resize the small tablecloth.
  - Keep the original room assets and floor geometry unchanged.
