kind: category_robot_task
id: wia_r_s3_seed202_produce_v1
version: 4
status: pending
source:
  provider: esi
  json: Specular Reflection/Correspondence/house_single_floor/dining_room_0/wia_furnished_background_v1.json
public:
  objective: Use the mirror to identify the two produce items and their initial distance
    order relative to the fixed stockpot. Move both items on the cutting board to
    reverse that order, with at least a 20 cm distance gap. The stockpot is the fixed
    reference; robot movement does not redefine it.
  success_criteria: Use genuine grasp and at least 5 cm lift for every required item.
    Release all required items stably in the specified destination for at least 0.5
    seconds, with linear speed at most 0.02 m/s and angular speed at most 0.1 rad/s.
    Empty and open the working hand, withdraw both hands, and declare DONE.
  environment: A furnished dining room with vegetables or fruit on native furniture,
    a real mirror, a stockpot, and a cutting board.
  constraints:
  - Keep the mirror, red outline, stockpot, cutting board and furniture fixed. Preserve
    item shapes and sizes.
  - Use the initial head-camera view to interpret the red outline; later robot motion
    does not change the requested identity.
  - Use guarded public controls and mounted observations. Unselected produce must
    remain within 2 cm of its initial position.
requirements:
  capabilities:
  - base_translation
  - base_rotation
  - ee_translation
  - ee_rotation
  - trunk_height
  - gripper
