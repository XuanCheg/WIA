      - id: reconfiguration
        kind: historical_checkpoint
      - id: stable_placement
        kind: terminal_condition
      relation: reverse_initial_distance_order
      distance_gap_m: 0.2
      requires_both_objects_moved: true
      non_goal_initialization_required: true
      scene_contract:
