    - mirror
    - mirror_post_0
    - mirror_post_1
    - anchor
    - cue_low
    - cue_high
    - cue_bottom
    - cue_top
    - candidate_0
    - candidate_1
    parameters:
      revision: wia_mirror_v2
      operation: mirror_reconfigure
      candidates:
        candidate_0: wia_mirror_candidate_0
        candidate_1: wia_mirror_candidate_1
      candidate_dimensions_m:
        candidate_0:
