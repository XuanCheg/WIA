kind: category_robot_task
id: wia_mirror_r_s2_v1
version: 2
status: pending
source:
  provider: esi
  json: Specular Reflection/Correspondence/hall_train_station/empty_room_0/wia_background_v1.json
public:
  objective: Identify the real block whose reflection is inside the red outline in the initial
    head-camera view. Move that block so it is at least 10 cm closer to the fixed yellow reference
    pillar than the other block. Grasp and lift it, then leave both blocks stably released
    on the worktable. Keep the other block in place.
  success_criteria: Use a genuine robot grasp to lift each required block at least 5 cm. Leave
    all required blocks supported and released without robot contact for at least 0.5 seconds,
    with linear speed at most 0.02 m/s and angular speed at most 0.1 rad/s. Leave the working
    hand empty and open, withdraw the robot hands from the blocks, and declare DONE.
  environment: A shared hall workstation with grey blocks, a physical mirror, a red outline,
    blue and yellow pads, and a fixed yellow reference pillar.
  constraints:
  - Keep the table, pads, mirror, red outline and yellow reference pillar fixed; preserve
    all object dimensions.
  - Use the existing guarded public controls and robot-mounted observations.
  - Interpret the requested appearance using the initial head-camera view. Later robot movement
    does not redefine the requested real block.
  - The first candidate grasp commits the real-object selection. Do not grasp a different
    candidate.
  - Keep each unselected block within 2 cm of its starting position.
  - Move the selected real block at least 5 cm from its starting position.
  - Measure distances in the horizontal plane from each real block to the fixed yellow pillar.
requirements:
  capabilities:
  - base_translation
  - base_rotation
  - ee_translation
  - ee_rotation
  - trunk_height
  - gripper
