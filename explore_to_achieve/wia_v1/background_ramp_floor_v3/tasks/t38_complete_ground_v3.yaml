public:
  objective: 'Inspect the three food items stored on the pantry shelves. Choose your own route
    and remember the order in which you first inspect each item. The items are a hamburger
    with filling, a plain bun, and a triangular sandwich; their locations are not supplied.
    After inspecting all three, submit ANSWER: SURVEY_COMPLETE. A delivery request referring
    to your actual inspection history will then arrive. Identify and deliver the requested
    item to the blue-rimmed serving tray.'
  success_criteria: Survey all three distinct items, answer the delayed history question correctly,
    then grasp the corresponding item and leave it stably released on the serving tray.
  environment: Food shelves face different approach directions in a furnished living area,
    with a separate serving tray for delivery.
  constraints:
  - Preserve all food items during the survey; retrieve only the requested item afterward.
  - 'An inspection uses a synchronized mounted-camera view within 2 m: at least 144 visible
    pixels and a visible bounding-box short side of at least 12 pixels. This records visual
    exposure, not recognition.'
  - Simultaneous first inspections do not establish an order. Repeated views count once.
  - The frozen global overview is context only; it does not create a live inspection event.
