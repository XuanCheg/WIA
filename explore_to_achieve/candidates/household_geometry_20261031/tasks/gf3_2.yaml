public:
  objective: Store the shorter spice jar upright in the low blue shelf compartment and the taller jar upright in
    the high yellow compartment. Compare the jars themselves. Leave one jar completely inside each compartment on
    its floor; keep both upright within 10 degrees of vertical.
  success_criteria: Leave every required item on its assigned compartment floor, entirely within its usable interior,
    released without robot contact and stable for at least 0.5 seconds. Keep linear speed at most 0.02 m/s and angular
    speed at most 0.1 rad/s. Finish with empty hands, the working gripper open and all hands at least 2 cm clear
    of the items. No minimum lift height or prior grasp is required. Declare DONE.
  environment: A kitchen preparation table with ordinary household items and physical storage compartments.
  constraints:
  - Use public robot sensors and legal physical controls.
  - Preserve object size and shape and the fixed storage apparatus.
  - Ordinary movable background furniture may be repositioned when needed.
  - Sliding and reorientation are allowed; the robot hand need not enter a narrow opening.
