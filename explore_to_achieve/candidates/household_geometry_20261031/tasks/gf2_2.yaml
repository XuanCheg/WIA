public:
  objective: Move the upright cutting board from its wide pickup stand into the narrow blue drying slot. Turn the
    board to match the slot, pass it through the front mouth, and leave the whole board inside, supported on the
    slot floor. The top of the board is exposed for handling at the pickup stand.
  success_criteria: The object must cross the front mouth from the outside through measured intermediate positions
    before its final placement. Routing over or around the mouth does not count. Leave every required item on its
    assigned compartment floor, entirely within its usable interior, released without robot contact and stable for
    at least 0.5 seconds. Keep linear speed at most 0.02 m/s and angular speed at most 0.1 rad/s. Finish with empty
    hands, the working gripper open and all hands at least 2 cm clear of the items. No minimum lift height or prior
    grasp is required. Declare DONE.
  environment: A kitchen preparation table with ordinary household items and physical storage compartments.
  constraints:
  - Use public robot sensors and legal physical controls.
  - Preserve object size and shape and the fixed storage apparatus.
  - Ordinary movable background furniture may be repositioned when needed.
  - Sliding and reorientation are allowed; the robot hand need not enter a narrow opening.
requirements:
  capabilities:
  - base_translation
  - base_rotation
  - ee_translation
  - ee_rotation
  - trunk_height
  - gripper
